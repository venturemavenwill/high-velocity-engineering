# ---------------------------------------------------------------------------
#
# The intended write path is a GitHub Copilot SDK agent that researches, judges
# and proposes upgrades to the knowledge. It is not built yet. When it is, it
# becomes a job here and the `verify` job above gates it unchanged, because
# pull_request already fires regardless of who opened the PR.
#
# THE THREE RULES IT INHERITS, none of which are negotiable:
#
#   1. It opens a pull request. It never pushes to main. The loop is unattended,
#      so a human merge is the only place a mistake reliably stops.
#   2. It never writes to graph/. That directory is derived from the markdown by
#      build-graph.ps1 and holds no facts of its own.
#   3. Every claim it proposes carries one of the four evidence classes, and it
#      may not upgrade a class. Direction and mechanism only for anything not
#      verified in this repository.
