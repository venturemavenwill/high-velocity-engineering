# The deterministic gate.
#
# Runs on every push and every pull request, whoever or whatever opened it.
# This is the half of the write path that must never be an LLM: a verifier that
# shares a model family with the proposer is not a verifier, it is an echo.
#
# See the commented `research` job at the bottom for where the HVE IQ agent
# attaches. Nothing in this job needs to change when it does.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP server dependencies
        working-directory: mcp/hve-iq
        run: npm install --no-audit --no-fund

      # pwsh is preinstalled on ubuntu-latest runners.
      - name: Run the gate
        shell: pwsh
        run: ./scripts/verify.ps1

      # graph/ is derived and committed. If a rebuild changes it, the committed
      # copy was stale — which means a claim query could have answered from a
      # graph that no longer matches the substrate.
      - name: Fail if the committed graph is stale
        shell: pwsh
        run: |
          $diff = git status --porcelain graph/
          if ($diff) {
            Write-Host "::error::graph/ is stale. Run pwsh ./scripts/build-graph.ps1 and commit the result."
            $diff | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "graph/ is current"

