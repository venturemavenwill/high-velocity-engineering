# The deterministic gate.
#
# Runs on every push and every pull request, whoever or whatever opened it.
# This is the half of the write path that must never be an LLM: a verifier that
# shares a model family with the proposer is not a verifier, it is an echo.
#
# See the commented `research` job at the bottom for where the HVE IQ agent
# attaches. Nothing in this job needs to change when it does.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP server dependencies
        working-directory: mcp/hve-iq
        run: npm install --no-audit --no-fund

      # pwsh is preinstalled on ubuntu-latest runners.
      - name: Run the gate
        shell: pwsh
        run: ./scripts/verify.ps1

      # graph/ is derived and committed. If a rebuild changes it, the committed
      # copy was stale — which means a claim query could have answered from a
      # graph that no longer matches the substrate.
      - name: Fail if the committed graph is stale
        shell: pwsh
        run: |
          $diff = git status --porcelain graph/
          if ($diff) {
            Write-Host "::error::graph/ is stale. Run pwsh ./scripts/build-graph.ps1 and commit the result."
            $diff | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "graph/ is current"

# ---------------------------------------------------------------------------
# The research agent lives in a separate private repository
# ---------------------------------------------------------------------------
#
# HVE IQ's write path is a GitHub Copilot SDK agent that researches, judges and
# proposes upgrades to this knowledge. It is built and run elsewhere, privately.
# Only the knowledge is public.
#
# Nothing needs to be added here for it to work. `pull_request` above already
# fires for any pull request whoever opens it, so the agent is gated by exactly
# the same checks a human is — which is the point. The gate is deliberately not
# an LLM: a verifier sharing a model family with the proposer is an echo, not a
# check.
#
# THE CONTRACT IT MUST SATISFY, none of it negotiable:
#
#   1. It opens a pull request against this repository. It never pushes to main.
#      The loop is unattended, so a human merge is the only place a mistake
#      reliably stops.
#   2. It never writes to graph/. That is derived from the markdown by
#      build-graph.ps1 and holds no facts of its own; the staleness check above
#      will fail the PR if it tries.
#   3. It may not upgrade an evidence class. Direction and mechanism only for
#      anything not verified in this repository, and no effect size for any
#      source the register marks unread.
#   4. Its PR body states the evidence class of every claim it proposes, so a
#      reviewer can check the class before the content. An upgraded class is the
#      failure mode that matters.
#
# Everything the agent needs to read is already served read-only by the MCP
# server in mcp/hve-iq: hve_platform_exposure names what has decayed,
# hve_sources names what rests on something nobody read, and
# hve_dependency_closure names what a change would drag in behind it.
